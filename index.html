<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人信息管家</title>
<style>
  :root{
    --bg:#f6f5f1; --panel:#ffffff; --ink:#2b2a26; --ink2:#6f6a5e; --line:#e7e3da;
    --brand:#3f6f5e; --brand-soft:#e6efe9; --accent:#c2703e; --accent-soft:#f7ece2;
    --red:#c0453e; --green:#3f8f5f; --shadow:0 1px 3px rgba(50,45,35,.08),0 6px 24px rgba(50,45,35,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
  #app{display:flex;height:100vh}
  /* Sidebar */
  .side{width:216px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .logo .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
  .logo b{font-size:16px}
  .logo small{display:block;color:var(--ink2);font-weight:400;font-size:11px}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;
    font-size:14px;color:var(--ink2);cursor:pointer;margin-bottom:2px;text-align:left}
  .nav button:hover{background:#f2efe8}
  .nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .nav button .ic{width:20px;text-align:center}
  .side .foot{margin-top:auto;font-size:11px;color:var(--ink2);padding:8px;line-height:1.6;border-top:1px dashed var(--line)}
  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
  .topbar h1{font-size:17px;flex:none}
  .searchbox{flex:1;max-width:520px;position:relative}
  .searchbox input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--line);border-radius:999px;background:#faf9f5;font-size:14px;outline:none}
  .searchbox input:focus{border-color:var(--brand);background:#fff}
  .searchbox::before{content:"🔍";position:absolute;left:12px;top:8px;font-size:14px;opacity:.6}
  .btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .view{flex:1;overflow-y:auto;padding:24px}
  .wrap{max-width:920px;margin:0 auto}
  /* Composer */
  .composer{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:20px}
  .composer textarea{width:100%;border:0;outline:none;resize:vertical;min-height:74px;font-size:15px;line-height:1.7;font-family:inherit}
  .composer .row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#faf9f5;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink2);cursor:pointer}
  .chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
  .hint{font-size:12px;color:var(--ink2)}
  /* Cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .n{font-size:24px;font-weight:700;color:var(--brand)}
  .stat .t{font-size:12px;color:var(--ink2);margin-top:2px}
  .sect{font-size:14px;font-weight:600;margin:18px 0 10px;color:var(--ink2);letter-spacing:.5px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
  .item:hover{box-shadow:var(--shadow)}
  .item .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2);margin-bottom:6px;flex-wrap:wrap}
  .tag{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .tag.idea{background:#fdf3e3;color:#a06a1c}.tag.material{background:#e8eefb;color:#3b5ca8}.tag.todo{background:var(--accent-soft);color:var(--accent)}
  .tag.cat{background:var(--brand-soft);color:var(--brand)}
  .item .content{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .item .content mark{background:#ffe9a8;border-radius:3px;padding:0 1px}
  .item .kw{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .item .kw span{font-size:11px;color:var(--ink2);background:#f3f1ea;border-radius:6px;padding:2px 8px}
  .item .sub{font-size:12px;color:var(--ink2);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .empty{text-align:center;color:var(--ink2);padding:60px 0;font-size:14px}
  .empty .big{font-size:38px;margin-bottom:10px}
  /* Todo */
  .todo-row{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px}
  .todo-row input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--brand);cursor:pointer}
  .todo-row.done .content{text-decoration:line-through;color:var(--ink2)}
  .due{font-size:11px;padding:2px 8px;border-radius:999px;background:#f3f1ea;color:var(--ink2)}
  .due.over{background:#fbe7e5;color:var(--red);font-weight:600}
  .due.soon{background:#fdf3e3;color:#a06a1c;font-weight:600}
  /* QA */
  .qa-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
  .qa-box textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:60px;font-size:14px;font-family:inherit;outline:none;resize:vertical}
  .answer{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .answer h4{color:var(--brand);font-size:14px;margin-bottom:8px}
  .answer p{font-size:14px;line-height:1.8}
  .src-list{font-size:12px;color:var(--ink2);margin-top:10px}
  .src-list a{color:var(--brand);cursor:pointer;margin-right:12px}
  .qa-history .q{font-weight:600;font-size:14px;margin-bottom:6px}
  /* Report */
  .report{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;line-height:1.9;font-size:14px}
  .report h3{font-size:16px;margin:14px 0 8px;color:var(--brand)}
  .report h3:first-child{margin-top:0}
  .report ul{padding-left:20px}
  .report li{margin-bottom:4px}
  .report .kpi{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
  .report .kpi b{color:var(--brand)}
  .bar{height:8px;border-radius:4px;background:var(--brand);display:inline-block;vertical-align:middle}
  /* Modal */
  .mask{position:fixed;inset:0;background:rgba(40,36,28,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:84vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal h3{font-size:16px;margin-bottom:12px}
  .modal .body{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
  .modal .block{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .modal .block h5{font-size:12px;color:var(--ink2);margin-bottom:6px}
  .rel{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px;cursor:pointer;color:var(--ink)}
  .rel:hover{border-color:var(--brand)}
  .modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#2b2a26;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}
  @media(max-width:760px){.side{width:64px}.side .logo b,.side .logo small,.side .nav span.t,.side .foot{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="logo"><div class="mark">✦</div><div><b>个人信息管家</b><small>你的第二大脑</small></div></div>
    <nav class="nav">
      <button data-v="home" class="on"><span class="ic">✏️</span><span class="t">快速记录</span></button>
      <button data-v="items"><span class="ic">🗂️</span><span class="t">条目库</span></button>
      <button data-v="todo"><span class="ic">✅</span><span class="t">待办整理</span></button>
      <button data-v="qa"><span class="ic">💬</span><span class="t">智能问答</span></button>
      <button data-v="report"><span class="ic">📊</span><span class="t">阶段总结</span></button>
    </nav>
    <div class="foot">数据保存在本机浏览器<br>支持导出备份 · v1.0</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="viewTitle">快速记录</h1>
      <div class="searchbox"><input id="searchInput" placeholder="搜索关键词，全库检索…（回车跳转条目库）"></div>
      <button class="btn" id="exportBtn">导出备份</button>
      <label class="btn" style="margin:0">导入<input type="file" id="importFile" accept=".json" hidden></label>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * 个人信息管家 —— 本地实现版
 * 数据层：localStorage（结构上与云数据库文档模型一致，便于后续迁移）
 * 智能层：本地 NLP 工具（分词/分类/摘要/关联/抽取）
 * ============================================================ */
const LS_KEY = 'pib_items_v1';

/* ---------- 数据层 ---------- */
const Store = {
  load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || null; }catch(e){ return null; } },
  save(items){ localStorage.setItem(LS_KEY, JSON.stringify(items)); },
  all(){ return this.load() || []; },
  add(item){ const a=this.all(); a.unshift(item); this.save(a); return item; },
  update(id, patch){ const a=this.all(); const i=a.findIndex(x=>x.id===id); if(i>=0){ Object.assign(a[i],patch); this.save(a);} },
  remove(id){ this.save(this.all().filter(x=>x.id!==id)); }
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------- 轻量中文 NLP ---------- */
const STOP = new Set(('的,了,我,你,他,她,它,们,在,是,有,和,就,都,也,与,及,或,这,那,个,为,到,对,要,不,会,可以,一下,一个,没有,把,被,让,得,着,过,吗,呢,吧,啊,很,还,但,因为,所以,如果,然后,现在,就是,什么,怎么,这个,那个,已经,还是,时候,应该,可能,一些,事情,东西,觉得,知道,自己,我们,你们,他们,以及,而且,但是,或者,不过,其中,之后,之前').split(','));
const NOISE = new Set(['今天','明天','昨天','下周','本周','上午','下午','晚上']);

function tokenize(text){
  const out = [];
  const runs = text.match(/[一-龥]+|[A-Za-z0-9_]+/g) || [];
  for(const run of runs){
    if(/^[A-Za-z0-9_]+$/.test(run)){
      if(run.length>1) out.push(run.toLowerCase());
      continue;
    }
    if(run.length===1){ if(!STOP.has(run)) out.push(run); continue; }
    // 整词（短词直接保留）
    if(run.length<=3 && !STOP.has(run) && !NOISE.has(run)) out.push(run);
    // 二元滑窗
    for(let i=0;i<run.length-1;i++){
      const bg = run.slice(i,i+2);
      if(!STOP.has(bg[0]) && !STOP.has(bg[1]) && !NOISE.has(bg)) out.push(bg);
    }
  }
  return out;
}

function keywordsOf(text, n=5){
  const freq = {};
  for(const t of tokenize(text)) freq[t]=(freq[t]||0)+1;
  return Object.entries(freq)
    .filter(([w,c]) => w.length>1 || c>1)
    .sort((a,b)=> b[1]-a[1] || b[0].length-a[0].length)
    .slice(0,n).map(x=>x[0]);
}

const CATS = {
  '工作': ['工作','会议','项目','客户','汇报','老板','同事','方案','合同','邮件','加班','面试','职场','周报','需求','上线','评审','KPI','OKR','deadline','团队','招聘'],
  '学习': ['学习','读书','课程','考试','论文','知识','笔记','教程','练习','书','阅读','复习','证书','英语','编程','文章'],
  '生活': ['生活','购物','家里','旅行','电影','朋友','聚餐','快递','装修','租房','搬家','做饭','菜单','假期','出行'],
  '财务': ['工资','理财','投资','股票','基金','预算','账单','报销','花费','支出','收入','存款','贷款','保险','记账'],
  '健康': ['健康','运动','医院','医生','体检','睡眠','锻炼','健身','饮食','跑步','感冒','药','体重','瑜伽'],
  '创意': ['想法','创意','灵感','点子','构思','设计','故事','策划','方案雏形','写作','脑洞']
};
function classifyOf(text){
  const low = text.toLowerCase(); let best='未分类', bs=0;
  for(const [cat, words] of Object.entries(CATS)){
    let s=0; for(const w of words){ const k=w.toLowerCase(); let i=0; while((i=low.indexOf(k,i))>=0){ s++; i+=k.length; } }
    if(s>bs){ bs=s; best=cat; }
  }
  return best;
}

function detectType(text){
  if(/(待办|todo|记得|别忘|需要.{0,6}(做|买|交|发|约|去)|要完成|提醒)/i.test(text)) return 'todo';
  if(/(https?:\/\/|资料|文档|摘录|引用|收藏|参考)/.test(text)) return 'material';
  return 'idea';
}

function summarizeOf(text){
  const clean = text.trim().replace(/\s+/g,' ');
  if(clean.length<=60) return clean;
  const sents = clean.split(/(?<=[。！？!?.])/).filter(Boolean);
  if(sents[0] && sents[0].length<=50) return sents[0] + (sents.length>1?'…':'');
  return clean.slice(0,58)+'…';
}

function highlightsOf(text){
  const pick = (re) => { const m = text.match(re); return m ? [...new Set(m)] : []; };
  return {
    '日期': pick(/\d{4}[-年/]\d{1,2}[-月/]\d{1,2}日?|\d{1,2}月\d{1,2}日|今天|明天|后天|下周[一二三四五六日天]?|周[一二三四五六日天]|本周[一二三四五六日天]?/g),
    '时间': pick(/(上午|下午|晚上|中午|早上)?\d{1,2}[:：]\d{2}|(上午|下午|晚上|中午|早上)\d{1,2}点(半)?/g),
    '链接': pick(/https?:\/\/[^\s，。；）)】]+/g),
    '人物': pick(/@[一-龥A-Za-z0-9_]+/g),
    '金额': pick(/[¥￥]\s?\d+(\.\d+)?|\d+(\.\d+)?\s?(元|块|万元|万)/g),
    '电话': pick(/1[3-9]\d{9}/g)
  };
}
function flatHighlights(h){ return Object.entries(h).flatMap(([k,v])=>v.map(x=>k+'：'+x)); }

/* 待办解析截止时间 */
function dueOf(text){
  const now = new Date();
  const at = (h,m)=>{ const d=new Date(now); d.setHours(h||18,m||0,0,0); return d; };
  let d=null;
  if(/后天/.test(text)) d=at(18,0), d.setDate(d.getDate()+2);
  else if(/明天/.test(text)) d=at(18,0), d.setDate(d.getDate()+1);
  else if(/今天|今晚/.test(text)) d=at(20,0);
  else { const m=text.match(/下周([一二三四五六日天])/); if(m){ const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0}; d=at(18,0); const target=map[m[1]]; let delta=(target-d.getDay()+7)%7||7; d.setDate(d.getDate()+delta);} }
  if(!d){ const m=text.match(/(\d{1,2})月(\d{1,2})日/); if(m){ d=new Date(now.getFullYear(), +m[1]-1, +m[2], 18, 0); if(d<now) d.setFullYear(d.getFullYear()+1);} }
  if(d){ const t=text.match(/(上午|下午|晚上|中午|早上)(\d{1,2})点/); if(t){ let h=+t[2]; if(t[1]==='下午'&&h<12)h+=12; if(t[1]==='晚上'&&h<12)h+=12; if(t[1]==='中午'&&h<12)h+=12; d.setHours(h,0,0,0);} }
  return d ? d.getTime() : null;
}

/* 关联度：关键词 Jaccard + 类别加成 */
function relatedOf(item, all, n=4){
  const kw = new Set(item.keywords||[]);
  return all.filter(x=>x.id!==item.id)
    .map(x=>{
      const k2=new Set(x.keywords||[]);
      const inter=[...kw].filter(w=>k2.has(w)).length;
      const union=new Set([...kw,...k2]).size||1;
      let s=inter/union + (x.category===item.category?0.05:0) + (x.type===item.type?0.03:0);
      return {x,s,inter};
    }).filter(r=>r.inter>0).sort((a,b)=>b.s-a.s).slice(0,n).map(r=>r.x);
}

/* ---------- 条目加工管线（模拟 Agent 自动处理） ---------- */
function processItem(raw){
  const type = raw.type==='auto' ? detectType(raw.content) : raw.type;
  const item = {
    id: uid(), type, content: raw.content.trim(),
    category: classifyOf(raw.content),
    keywords: keywordsOf(raw.content),
    summary: summarizeOf(raw.content),
    highlights: highlightsOf(raw.content),
    createdAt: Date.now(), done:false,
    due: null
  };
  if(item.type==='todo') item.due = dueOf(raw.content);
  return item;
}

/* ---------- 视图渲染 ---------- */
const $ = s=>document.querySelector(s);
const view = $('#view');
let state = { view:'home', search:'', filter:{type:'all',cat:'all'} };
const TITLES = {home:'快速记录', items:'条目库', todo:'待办整理', qa:'智能问答', report:'阶段总结'};
const TYPE_NAME = {idea:'想法', material:'资料', todo:'待办'};

function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtDay(ts){ const d=new Date(ts); return `${d.getMonth()+1}月${d.getDate()}日`; }
function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function highlightHtml(text, q){
  let h = esc(text);
  if(q){ for(const w of [...new Set(q.trim().split(/\s+/))].filter(Boolean)){ h = h.split(esc(w)).join('<mark>'+esc(w)+'</mark>'); } }
  return h;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function itemCard(item, q){
  const rel = relatedOf(item, Store.all());
  const hl = flatHighlights(item.highlights||{});
  return `<div class="item" data-id="${item.id}">
    <div class="meta">
      <span class="tag ${item.type}">${TYPE_NAME[item.type]}</span>
      <span class="tag cat">${esc(item.category)}</span>
      <span>${fmtTime(item.createdAt)}</span>
      ${item.type==='todo' ? (item.done?'<span style="color:var(--green)">已完成</span>':(item.due?`<span class="due ${item.due<Date.now()?'over':(item.due-Date.now()<86400000*2?'soon':'')}">${item.due<Date.now()?'逾期':'截止'} ${fmtDay(item.due)}</span>`:'')) : ''}
    </div>
    <div class="content">${highlightHtml(item.content.length>160 ? item.content.slice(0,160)+'…' : item.content, q)}</div>
    <div class="kw">${(item.keywords||[]).map(k=>`<span>#${esc(k)}</span>`).join('')}</div>
    ${hl.length?`<div class="sub">⚑ 重点：${esc(hl.slice(0,4).join('　'))}</div>`:''}
    ${rel.length?`<div class="sub">↔ 关联 ${rel.length} 条：${esc(rel.map(r=>r.summary.slice(0,16)).join(' / '))}…</div>`:''}
  </div>`;
}

function bindItemClicks(){
  view.querySelectorAll('.item').forEach(el=> el.onclick = ()=> openDetail(el.dataset.id));
}

/* --- 首页 --- */
function renderHome(){
  const all = Store.all();
  const week = all.filter(i=>Date.now()-i.createdAt<7*86400000);
  const todos = all.filter(i=>i.type==='todo'&&!i.done);
  view.innerHTML = `<div class="wrap">
    <div class="composer">
      <textarea id="cInput" placeholder="此刻在想什么？随手记下来——想法、资料链接、待办事项都可以。&#10;我会自动分类、提取关键词、找关联内容。"></textarea>
      <div class="row">
        <span class="hint">类型：</span>
        <span class="chip on" data-t="auto">智能识别</span>
        <span class="chip" data-t="idea">想法</span>
        <span class="chip" data-t="material">资料</span>
        <span class="chip" data-t="todo">待办</span>
        <span style="flex:1"></span>
        <button class="btn primary" id="saveBtn">保存并分析</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">${all.length}</div><div class="t">全部条目</div></div>
      <div class="stat"><div class="n">${week.length}</div><div class="t">近 7 天新增</div></div>
      <div class="stat"><div class="n">${todos.length}</div><div class="t">待办未完成</div></div>
      <div class="stat"><div class="n">${new Set(all.map(i=>i.category)).size}</div><div class="t">涉及分类</div></div>
    </div>
    <div class="sect">最近记录</div>
    ${all.slice(0,8).map(i=>itemCard(i)).join('') || `<div class="empty"><div class="big">🌱</div>还没有内容，从上方记下第一条想法吧</div>`}
  </div>`;
  let t='auto';
  view.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ view.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); t=c.dataset.t; });
  $('#saveBtn').onclick = ()=>{
    const txt = $('#cInput').value; if(!txt.trim()) return toast('先写点什么吧');
    const item = Store.add(processItem({type:t, content:txt}));
    toast(`已保存 · 自动归类「${item.category}」`); renderHome();
  };
  $('#cInput').addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter') $('#saveBtn').click(); });
  bindItemClicks();
}

/* --- 条目库 --- */
function renderItems(){
  const all = Store.all();
  const cats = [...new Set(all.map(i=>i.category))];
  const q = state.search;
  let list = all.filter(i=>{
    if(state.filter.type!=='all' && i.type!==state.filter.type) return false;
    if(state.filter.cat!=='all' && i.category!==state.filter.cat) return false;
    if(q){ const hay=(i.content+' '+(i.keywords||[]).join(' ')+' '+i.category).toLowerCase();
      return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w)); }
    return true;
  });
  view.innerHTML = `<div class="wrap">
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <span class="chip ${state.filter.type==='all'?'on':''}" data-f="type" data-v="all">全部类型</span>
      ${Object.entries(TYPE_NAME).map(([k,v])=>`<span class="chip ${state.filter.type===k?'on':''}" data-f="type" data-v="${k}">${v}</span>`).join('')}
      <span style="width:10px"></span>
      <span class="chip ${state.filter.cat==='all'?'on':''}" data-f="cat" data-v="all">全部分类</span>
      ${cats.map(c=>`<span class="chip ${state.filter.cat===c?'on':''}" data-f="cat" data-v="${esc(c)}">${esc(c)}</span>`).join('')}
    </div>
    ${q?`<div class="hint" style="margin-bottom:12px">搜索「${esc(q)}」命中 ${list.length} 条</div>`:''}
    ${list.map(i=>itemCard(i,q)).join('') || `<div class="empty"><div class="big">🔍</div>没有匹配的条目</div>`}
  </div>`;
  view.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ state.filter[c.dataset.f]=c.dataset.v; renderItems(); });
  bindItemClicks();
}

/* --- 待办 --- */
function renderTodo(){
  const all = Store.all();
  const todos = all.filter(i=>i.type==='todo').sort((a,b)=>(a.done-b.done)||((a.due||9e15)-(b.due||9e15)));
  const pending = todos.filter(t=>!t.done), done = todos.filter(t=>t.done);
  const row = t=>`<div class="todo-row ${t.done?'done':''}" data-id="${t.id}">
      <input type="checkbox" ${t.done?'checked':''}>
      <div style="flex:1">
        <div class="content" style="font-size:14px;line-height:1.7">${esc(t.content)}</div>
        <div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="tag cat">${esc(t.category)}</span>
          ${t.due?`<span class="due ${!t.done&&t.due<Date.now()?'over':(!t.done&&t.due-Date.now()<2*86400000?'soon':'')}">截止 ${fmtTime(t.due)}</span>`:'<span class="due">无截止时间</span>'}
          <span class="hint">${fmtDay(t.createdAt)} 记录</span>
        </div>
      </div>
      <button class="btn del" style="padding:4px 10px">删除</button>
    </div>`;
  view.innerHTML = `<div class="wrap">
    <div class="sect">进行中（${pending.length}）</div>
    ${pending.map(row).join('') || `<div class="empty"><div class="big">🎉</div>待办都清空啦</div>`}
    ${done.length?`<div class="sect">已完成（${done.length}）</div>${done.map(row).join('')}`:''}
  </div>`;
  view.querySelectorAll('.todo-row').forEach(el=>{
    el.querySelector('input').onchange = e=>{ Store.update(el.dataset.id,{done:e.target.checked}); renderTodo(); toast(e.target.checked?'已完成，干得漂亮':'已重新打开'); };
    el.querySelector('.del').onclick = ()=>{ Store.remove(el.dataset.id); renderTodo(); toast('已删除'); };
  });
}

/* --- 智能问答 --- */
const qaHistory = [];
function renderQA(){
  view.innerHTML = `<div class="wrap">
    <div class="qa-box">
      <textarea id="qaInput" placeholder="基于你记录的内容提问，例如：&#10;· 我最近在关注什么？&#10;· 关于 xx 我都记了什么？&#10;· 我这周还有什么没做？"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span class="hint">回答基于本地记录的关键词匹配与内容抽取生成</span>
        <button class="btn primary" id="askBtn">提问</button>
      </div>
    </div>
    <div class="qa-history" id="qaHistory">${qaHistory.map(renderOneQA).join('')}</div>
  </div>`;
  $('#askBtn').onclick = ask;
  $('#qaInput').addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter') ask(); });
}
function renderOneQA(r){
  return `<div class="answer" style="margin-bottom:16px">
    <div class="q">Q：${esc(r.q)}</div>
    <h4>回答</h4><p>${r.a}</p>
    ${r.src.length?`<div class="src-list">依据：${r.src.map(id=>`<a data-open="${id}">查看条目</a>`).join('')}</div>`:''}
  </div>`;
}
function ask(){
  const q = $('#qaInput').value.trim(); if(!q) return toast('请输入问题');
  const all = Store.all();
  if(!all.length){ qaHistory.unshift({q, a:'你还没有任何记录，先去「快速记录」里写几条吧。', src:[]}); return renderQA(); }
  // 特殊意图：待办盘点
  if(/(没做|未完成|待办|还要做什么|什么事没)/.test(q)){
    const p = all.filter(i=>i.type==='todo'&&!i.done);
    const a = p.length ? `你还有 ${p.length} 件未完成的事：<br>` + p.slice(0,6).map((t,i)=>`${i+1}. ${esc(t.summary)}${t.due?`（截止 ${fmtDay(t.due)}${t.due<Date.now()?'，已逾期':''}）`:''}`).join('<br>') : '太棒了，所有待办都已完成。';
    qaHistory.unshift({q,a,src:p.slice(0,6).map(t=>t.id)}); return renderQA();
  }
  // 打分：问题词与条目内容/关键词重叠
  const qTokens = new Set(tokenize(q));
  const scored = all.map(item=>{
    const hay = (item.content+' '+(item.keywords||[]).join(' ')).toLowerCase();
    let s=0; for(const t of qTokens){ if((item.keywords||[]).includes(t)) s+=3; else if(hay.includes(t.toLowerCase())) s+=1; }
    return {item,s};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).slice(0,5);
  let a;
  if(!scored.length){
    a = '在你的记录里没有找到与这个问题直接相关的内容。可以换个关键词试试，或者先记录一些相关资料。';
  } else {
    const cats = [...new Set(scored.map(r=>r.item.category))];
    const kws = [...new Set(scored.flatMap(r=>r.item.keywords||[]))].slice(0,6);
    a = `找到 ${scored.length} 条相关记录（主要属于「${cats.join('、')}」）。要点如下：<br>` +
      scored.slice(0,4).map((r,i)=>`${i+1}. ${esc(r.item.summary)}（${fmtDay(r.item.createdAt)}）`).join('<br>') +
      `<br>综合来看，这些内容围绕 ${kws.map(k=>'「'+esc(k)+'」').join('、')} 展开。`;
  }
  qaHistory.unshift({q, a, src:scored.map(r=>r.item.id)});
  renderQA();
  view.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDetail(el.dataset.open));
}

/* --- 阶段总结 --- */
function renderReport(){
  view.innerHTML = `<div class="wrap">
    <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center">
      <span class="hint">统计范围：</span>
      <span class="chip on" data-d="7">近 7 天</span>
      <span class="chip" data-d="30">近 30 天</span>
      <span class="chip" data-d="0">全部</span>
      <span style="flex:1"></span>
      <button class="btn" id="copyReport">复制总结</button>
    </div>
    <div id="reportBody"></div>
  </div>`;
  const gen = d=>{
    view.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', +c.dataset.d===d));
    $('#reportBody').innerHTML = buildReport(d);
  };
  view.querySelectorAll('.chip').forEach(c=>c.onclick=()=>gen(+c.dataset.d));
  $('#copyReport').onclick = ()=>{ navigator.clipboard.writeText($('#reportBody').innerText).then(()=>toast('已复制到剪贴板')); };
  gen(7);
}
function buildReport(days){
  const now = Date.now();
  const all = Store.all();
  const list = days ? all.filter(i=>now-i.createdAt<days*86400000) : all;
  const label = days?`近 ${days} 天`:'全部时间';
  if(!list.length) return `<div class="report">${label}没有记录。开始记录后，这里会生成你的阶段总结。</div>`;
  const byType = {idea:0,material:0,todo:0}; list.forEach(i=>byType[i.type]++);
  const byCat = {}; list.forEach(i=>byCat[i.category]=(byCat[i.category]||0)+1);
  const catSorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = catSorted[0][1];
  const kwFreq = {}; list.forEach(i=>(i.keywords||[]).forEach(k=>kwFreq[k]=(kwFreq[k]||0)+1));
  const topKw = Object.entries(kwFreq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
  const pending = all.filter(i=>i.type==='todo'&&!i.done);
  const overdue = pending.filter(i=>i.due&&i.due<now);
  const doneThis = all.filter(i=>i.type==='todo'&&i.done && (!days || now-i.createdAt<days*86400000));

  // 行动建议（基于规则引擎）
  const tips = [];
  if(overdue.length) tips.push(`有 ${overdue.length} 件待办已逾期（如「${esc(overdue[0].summary.slice(0,20))}」），建议今天优先处理或重新排期。`);
  if(pending.length>5) tips.push(`未完成待办偏多（${pending.length} 件），建议按「重要且紧急」四象限做一次梳理，只保留本周必须完成的 3 件。`);
  if(byType.idea>0 && byType.idea>byType.todo*2) tips.push(`想法积累较多但转化为待办的很少，可以挑选 1-2 个想法（如围绕「${esc((list.find(i=>i.type==='idea')||{}).category||'创意')}」）落地成具体行动。`);
  if(byType.material>3) tips.push(`收集了 ${byType.material} 条资料，建议安排一次集中阅读，把资料消化为想法或待办。`);
  const biggest = catSorted[0];
  if(biggest && biggest[1]/list.length>0.5) tips.push(`「${esc(biggest[0])}」占了记录的 ${Math.round(biggest[1]/list.length*100)}%，说明近期精力高度集中于此，注意平衡休息与其他事务。`);
  if(!doneThis.length && pending.length) tips.push('这段时间没有完成的待办记录，试着每天挑一件最小的任务先完成，建立推进感。');
  if(!tips.length) tips.push('记录节奏良好，继续保持。可以为下个阶段设定一个聚焦主题。');

  return `<div class="report" id="reportCard">
    <h3>📅 ${label}总结（${list.length} 条记录）</h3>
    <div class="kpi"><span>想法 <b>${byType.idea}</b></span><span>资料 <b>${byType.material}</b></span><span>待办 <b>${byType.todo}</b></span><span>完成待办 <b>${doneThis.length}</b></span><span style="color:var(--red)">逾期 <b>${overdue.length}</b></span></div>
    <h3>🏷️ 分类分布</h3>
    <ul>${catSorted.map(([c,n])=>`<li>${esc(c)}：${n} 条 <span class="bar" style="width:${Math.round(n/maxCat*120)}px"></span></li>`).join('')}</ul>
    <h3>🔥 高频主题</h3>
    <p>${topKw.length?topKw.map(k=>'「'+esc(k)+'」').join('、'):'（暂无）'}</p>
    <h3>✅ 待办进展</h3>
    <ul>
      <li>本阶段完成 ${doneThis.length} 件${doneThis.length?`（最近：${esc(doneThis[0].summary.slice(0,24))}）`:''}</li>
      <li>未完成 ${pending.length} 件${overdue.length?`，其中 <span style="color:var(--red)">逾期 ${overdue.length} 件</span>`:''}</li>
    </ul>
    <h3>🧭 后续行动建议</h3>
    <ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul>
    <p style="margin-top:14px;color:var(--ink2);font-size:12px">生成时间：${fmtTime(now)} · 基于本地规则引擎，接入云端大模型后可生成更深入的语义总结</p>
  </div>`;
}

/* --- 详情弹窗 --- */
function openDetail(id){
  const item = Store.all().find(i=>i.id===id); if(!item) return;
  const hl = flatHighlights(item.highlights||{});
  const rel = relatedOf(item, Store.all());
  const mask = $('#mask'), modal = $('#modal');
  modal.innerHTML = `
    <div class="meta" style="display:flex;gap:8px;font-size:12px;color:var(--ink2);margin-bottom:10px">
      <span class="tag ${item.type}">${TYPE_NAME[item.type]}</span>
      <span class="tag cat">${esc(item.category)}</span>
      <span>${fmtTime(item.createdAt)}</span>
    </div>
    <div class="body">${esc(item.content)}</div>
    <div class="block"><h5>AI 摘要</h5><div style="font-size:13px">${esc(item.summary)}</div></div>
    <div class="block"><h5>关键词</h5><div class="kw" style="display:flex;gap:6px;flex-wrap:wrap">${(item.keywords||[]).map(k=>`<span style="font-size:12px;background:#f3f1ea;border-radius:6px;padding:2px 8px">#${esc(k)}</span>`).join('')||'—'}</div></div>
    ${hl.length?`<div class="block"><h5>重点信息提取</h5><div style="font-size:13px">${hl.map(esc).join('<br>')}</div></div>`:''}
    ${rel.length?`<div class="block"><h5>关联内容（${rel.length}）</h5>${rel.map(r=>`<span class="rel" data-rel="${r.id}">${esc(r.summary.slice(0,60))} <span style="color:var(--ink2)">· ${fmtDay(r.createdAt)}</span></span>`).join('')}</div>`:''}
    <div class="actions">
      ${item.type==='todo'?`<button class="btn" id="mDone">${item.done?'重新打开':'标记完成'}</button>`:''}
      <button class="btn" id="mDel" style="color:var(--red)">删除</button>
      <button class="btn primary" id="mClose">关闭</button>
    </div>`;
  mask.classList.add('show');
  mask.onclick = e=>{ if(e.target===mask) mask.classList.remove('show'); };
  $('#mClose').onclick = ()=>mask.classList.remove('show');
  $('#mDel').onclick = ()=>{ Store.remove(id); mask.classList.remove('show'); rerender(); toast('已删除'); };
  const md = $('#mDone'); if(md) md.onclick = ()=>{ Store.update(id,{done:!item.done}); mask.classList.remove('show'); rerender(); };
  modal.querySelectorAll('[data-rel]').forEach(el=>el.onclick=()=>openDetail(el.dataset.rel));
}

/* ---------- 路由与全局 ---------- */
function rerender(){ ({home:renderHome, items:renderItems, todo:renderTodo, qa:renderQA, report:renderReport})[state.view](); }
function switchView(v){
  state.view=v; $('#viewTitle').textContent=TITLES[v];
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  rerender();
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.v));
$('#searchInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ state.search = e.target.value.trim(); switchView('items'); }
});
$('#exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(Store.all(),null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='个人信息管家备份-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('已导出备份文件');
};
$('#importFile').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const arr=JSON.parse(r.result);
      if(!Array.isArray(arr)) throw 0;
      const exist=new Set(Store.all().map(i=>i.id));
      const add=arr.filter(i=>i.id&&i.content&&!exist.has(i.id));
      Store.save([...add, ...Store.all()]);
      rerender(); toast(`成功导入 ${add.length} 条`);
    }catch(_){ toast('文件格式不正确'); } };
  r.readAsText(f); e.target.value='';
};

    {type:'todo', content:'待办：明天下午3点前把季度总结 PPT 初稿发给 @王姐 审阅，记得附上 Q4 数据。'},

    {type:'idea', content:'健身计划调整想法：把跑步改成隔天一次，加上拉伸，目标是12月底前体重减到 72kg。'},
    {type:'todo', content:'记得本周五给妈妈打电话，顺便确认春节回家的车票预算大概 800 元。'}
  ];
  Store.save(seed.map(s=>processItem(s)));
}

renderHome();
